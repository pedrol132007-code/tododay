# Lint, testes e build em todo pull request e em todo push no master (o branch de produção).
name: CI

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verificar:
    name: Lint, testes e build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Lint
        run: npm run lint

      - name: Função de anexos gerada está em dia
        run: |
          npm run gen:function
          git diff --exit-code -- supabase/functions/attachments/index.ts

      - name: Testes
        run: npm test

      - name: Build
        run: npm run build
