# Lint, testes e build em todo pull request e em todo push no master (o branch de produção).
name: CI

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verificar:
    name: Lint, testes e build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Lint
        run: npm run lint

      - name: Arquivos gerados estão em dia
        run: |
          npm run gen:function
          npm run gen:setup
          git diff --exit-code -- supabase/functions/attachments/index.ts supabase/setup_producao.sql

      - name: Testes
        run: npm test

      - name: Build
        run: npm run build

  banco:
    name: Banco - migrations e testes SQL
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      # Postgres descartável, igual ao dos projetos na nuvem (com os schemas auth e storage).
      - name: Sobe o Postgres local
        run: supabase db start

      - name: Migrations do zero, testes SQL e auditoria
        run: node scripts/test-db.mjs
        env:
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres
