<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/b-mark.svg" />
    <title>Tododay</title>
    <script>
      // Aplica o tema antes do React carregar, para não piscar. Mesma regra de src/lib/theme.ts.
      try {
        var pref = localStorage.getItem("tododay.theme");
        var dark = pref === "dark" || (pref !== "light" && matchMedia("(prefers-color-scheme: dark)").matches);
        if (dark) document.documentElement.classList.add("dark");
      } catch (e) {}
    </script>
  </head>
  <body class="bg-bg-base text-text-primary font-sans">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
