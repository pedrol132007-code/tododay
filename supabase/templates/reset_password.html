<!-- Supabase: Authentication → Emails → Templates → "Reset password"
     Assunto: Redefina sua senha do Tododay -->
<div style="font-family: Arial, sans-serif; max-width: 480px; margin: 0 auto; color: #1f1d2b;">
  <div style="height: 4px; background: linear-gradient(90deg, #2538FF, #E51E47); border-radius: 2px;"></div>
  <h2 style="color: #1f1d2b; font-weight: normal;">Nova senha</h2>
  <p>Recebemos um pedido para redefinir a senha da sua conta no Tododay.</p>
  <p>
    <a href="{{ .RedirectTo }}#token_hash={{ .TokenHash }}&type=recovery"
       style="display: inline-block; background: #2538FF; color: #ffffff; padding: 12px 20px; border-radius: 8px; text-decoration: none; font-weight: bold; text-transform: uppercase; font-size: 13px;">
      Definir nova senha
    </a>
  </p>
  <p style="color: #6b6880; font-size: 13px;">O link vale por 24 horas e funciona uma vez.</p>
  <p style="color: #6b6880; font-size: 13px;">Se não foi você, ignore este e-mail: sua senha continua a mesma.</p>
</div>
